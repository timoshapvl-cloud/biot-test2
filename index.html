:root{--bg:#f2f5f3;--card:#fff;--ink:#18231f;--green:#1d6252;--soft:#e7efeb;--border:#d9e2dd}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);padding:14px 12px 35px}main{max-width:650px;margin:0 auto}.top{padding:10px 2px 14px}.title{font-size:24px;font-weight:800;letter-spacing:-.5px}.subtitle{color:#61716b;font-size:14px;margin-top:4px}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;margin-top:12px;box-shadow:0 5px 18px #17382c0b}.range,label{font-size:14px;font-weight:700}.select,button{font:inherit}select{width:100%;margin-top:8px;padding:14px;border-radius:13px;border:1px solid var(--border);background:white;color:var(--ink);font-size:16px}.progressrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#63716c;margin-bottom:9px}.bar{height:8px;background:#e6ece8;border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--green);width:0;transition:.2s}.question{font-size:18px;font-weight:750;line-height:1.4;white-space:pre-wrap}.answers{display:grid;gap:10px;margin-top:17px}.option{width:100%;text-align:left;border:1px solid var(--border);background:#fff;border-radius:15px;padding:14px 13px;display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.35;cursor:pointer}.option .letter{min-width:28px;height:28px;border-radius:9px;background:var(--soft);color:var(--green);display:grid;place-items:center;font-weight:800}.option.selected{border-color:var(--green);background:#eff7f2}.option.correct{border-color:#27814e;background:#edf8ef}.option.wrong{border-color:#c75353;background:#fff0ef}.controls{display:flex;gap:9px;margin-top:18px}.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:750;cursor:pointer}.primary{background:var(--green);color:white;flex:1}.secondary{background:var(--soft);color:var(--ink).btn:disabled{opacity:.4}.result{text-align:center}.score{font-size:36px;font-weight:900;color:var(--green)}.review{text-align:left;margin-top:15px}.reviewitem{padding:13px 0;border-bottom:1px solid var(--border);font-size:14px;line-height:1.4}.muted{color:#66736e;font-size:13px}.hide{display:none}
</style></head><body><main><header class="top"><div class="title">Безопасность и охрана труда</div><div class="subtitle">Тест для телефона · 106 вопросов · по 30 вопросов в блоке</div></header><section class="card"><label for="block">Выбери блок вопросов</label><select id="block"></select></section><section class="card" id="quiz"><div class="progressrow"><span id="counter">Вопрос 1 / 30</span><span id="pct">0%</span></div><div class="bar"><div class="fill" id="fill"></div></div><div style="height:18px"></div><div class="question" id="q"></div><div class="answers" id="answers"></div><div class="controls"><button class="btn secondary" id="prev">← Назад</button><button class="btn primary" id="next">Далее →</button></div></section><section class="card hide result" id="result"></section></main><script>
const DATA=[{"q": "В каких случаях ответственные работники проходят внеочередную проверку знаний по безопасности и охране труда?", "a": "1) при введении в действие новых нормативных правовых актов по безопасности и охране труда, при внесении в них изменений и дополнений; 2) при вводе в эксплуатацию нового оборудования или внедрении новых технологических процессов по решению работодателя; 3) при переводе ответственного лица на другое место работы или назначении его на другую должность, требую- щую дополнительных знаний по безопасности и охране труда по решению работодателя; 4) по решению комиссии по расследованию несчастных случаев при допущении несчастных случаев – групповых, со смертельным или тяжелым (инвалидным) исходом, а также при возникновении аварии, взрыва, пожара или отравления; 5) при перерыве в работе более одного года."}, {"q": "В какой срок на работника налагается дисциплинарное взыскание?", "a": "Непосредственно при обнаружении дис- циплинарного проступка, но не позднее одного месяца со дня его обнаружения."}, {"q": "В какой срок работник вправе по своей инициативе расторгнуть трудовой договор, предупредив об этом работодателя письменно?", "a": "Не менее чем за один месяц."}, {"q": "В какой срок, по окончании расследования каждого несчастного случая, работодатель обязан выдать по- страдавшему или его доверенному лицу акт о несчастном случае?", "a": "Не позднее трёх рабочих дней."}, {"q": "В какой срок, по окончании расследования несчастного случая, один экземпляр копии материалов акта спе- циального расследования государственным инспектором труда направляется в местный орган внутренних дел?", "a": "Семидневный."}, {"q": "В какой форме токсичный материал представляет наивысшую опасность для человека?", "a": "Пары."}, {"q": "В каком размере производится компенсационная выплата работнику работодателем при расторжении тру- дового договора по инициативе работодателя, в случае снижения объёма производства, повлекшего ухудше- ние экономического состояния работодателя?", "a": "В размере заработной платы за два месяца."}, {"q": "В каком случае допускаются сверхурочные работы без согласия работника?", "a": "Все ответы верны. (для оказа- ния экстренной и неотложной помощи гражданам, которым угрожает потеря здоровья или гибель; для устране- ния иных обстоятельств, нарушающих нормальное функционирование водоснабжения, газоснабжения, тепло- снабжения, энергоснабжения и других систем жизнеобеспечения; для продолжения работы при неявке сменяю- щего работника, если работа не допускает перерыва, с немедленным принятием мер к замене другим работни- ком)."}, {"q": "В каком случае переносится оплачиваемый ежегодный трудовой отпуск полностью или в его части?", "a": "Вре- менной нетрудоспособности работника; при отпуске по беременности и родам."}, {"q": "В каком случае работодатель или принимающая сторона обязаны отстранить работника от работы?", "a": "Не обеспечившего сохранность имущества и других ценностей, переданных работнику, работнику направляющей стороны на основании письменного договора о принятии на себя полной материальной ответственности."}, {"q": "В случае, если член комиссии по расследованию несчастного случая не согласен с выводами комиссии (большинства), он представляет в письменном виде своё мотивированное мнение для включения его в мате- риал расследования. С какой оговоркой он подписывает акт специального расследования?", "a": "«Смотри осо- бое мнение»."}, {"q": "В течение какого времени с момента получения заключения о степени тяжести производственной травмы работодателем создаётся комиссия по расследованию несчастных случаев, связанных с трудовой деятельно- стью?", "a": "В течении 24 часов с момента получения заключения о степени тяжести производственной травмы."}, {"q": "В течение какого срока материалы расследования несчастного случая подлежат хранению в организации?", "a": "В течение сорока пяти лет."}, {"q": "В целях проверки соответствия квалификации работника поручаемой работе при заключении трудового договора в трудовом договоре может быть установлено…?", "a": "Условие об испытательном сроке. В чём отличие трудового договора от иных видов договоров? – Все ответы верны. (получение работником за- работной платы за труд; выполнение обязательств лично с подчинением трудовому распорядку; выполнение ра- ботником работы (трудовой функции) по определенной квалификации, специальности, профессии или должно- сти)."}, {"q": "Вид юридической ответственности, которая выражается в применении уполномоченным органом или долж- ностным лицом административного взыскания к лицу, совершившему правонарушение, – это?", "a": "Админи- стративная ответственность."}, {"q": "Вид юридической ответственности, основным содержанием которого выступают меры, применяемые госу- дарственными органами к лицу в связи с совершением им преступления, – это?", "a": "Уголовная ответствен- ность."}, {"q": "Виды дисциплинарных взысканий?", "a": "Все ответы верны. (замечание, выговор, строгий выговор)."}, {"q": "Виды рабочего времени?", "a": "Нормальной продолжительности; сокращённой продолжительности; неполным."}, {"q": "Временем отдыха является?", "a": "Все ответы верны. (ежедневный (междусменный) отдых; отпуск; перерывы в течение рабочего дня)."}, {"q": "Документом, подтверждающим трудовую деятельность работника, может быть…?", "a": "Трудовая книжка (при её наличии), индивидуальный трудовой договор либо выписки из приказов о приёме и увольнении или послужной спи- сок."}, {"q": "Допуск к работе лица осуществляется только после…?", "a": "Заключения трудового договора."}, {"q": "Допускается ли привлечение работника к работе в течение двух рабочих смен подряд?", "a": "Запрещается."}, {"q": "За счёт каких средств проводятся обучение, инструктирование, проверка знаний работников по вопросам безопасности и охраны труда?", "a": "За счёт собственных средств работодателя."}, {"q": "К какой категории опасных факторов относится повышенный уровень шума?", "a": "Физический."}, {"q": "К мероприятиям по безопасности и охране труда относятся…?", "a": "Все варианты верны. (обеспечение работни- ков средствами индивидуальной и коллективной защиты; проведение периодических медицинских осмотров; обу- чение работников правилам БиОТ, промышленной безопасности, пожарной безопасности)."}, {"q": "Какие несчастные случаи подлежат специальному расследованию?", "a": "Все варианты верны. (групповые случаи острого отравления; групповые несчастные случаи, связанные с трудовой деятельностью, происшедшие одновре- менно с двумя и более работниками, независимо от степени тяжести производственных травм пострадавших; несчастные случаи, связанные с трудовой деятельностью, с тяжёлым или со смертельным исходом)."}, {"q": "Какие отношения регулирует Трудовой Кодекс Республики Казахстан?", "a": "Трудовой кодекс регулирует отноше- ния: трудовые; непосредственно связанные с трудовыми; социального партнёрства; по безопасности и охране труда."}, {"q": "Какие права в отношении СИЗ имеет работник в соответствии с статьёй 181 ТК РК?", "a": "1) рабочее место, обо- рудованное в соответствии с требованиями по безопасности и охране труда; 2) обеспечение санитарно-бытовыми помещениями, средствами индивидуальной и коллективной защиты в соот- ветствии с требованиями по безопасности и охране труда, а также трудовым, коллективным договорами; 3) обращение в местный орган по инспекции труда о проведении обследования условий и охраны труда на его ра- бочем месте; 4) участие лично или через своего представителя в проверке и рассмотрении вопросов, связанных с улучшением условий, безопасности и охраны труда; 5) отказ от выполнения работы в случае необеспечения работодателем работника средствами индивидуальной и (или) коллективной защиты и при возникновении ситуации, создающей угрозу его здоровью или жизни, с письмен- ным извещением об этом непосредственного руководителя или работодателя; 6) образование и профессиональную подготовку, необходимые для безопасного исполнения трудовых обязанно- стей, в порядке, установленном законодательством Республики Казахстан; 7) получение достоверной информации от работодателя о характеристике рабочего места и территории орга- низации, состоянии условий, безопасности и охраны труда, о существующем профессиональном риске, а также о мерах по его защите от воздействия вредных и (или) опасных производственных факторов; 8) сохранение заработной платы на время приостановки работы организации из-за несоответствия требованиям по безопасности и охране труда."}, {"q": "Какие три элемента необходимы для функционирования СИЗ от падения?", "a": "Привязь; анкерное устройство; соединительно-амортизирующая подсистема."}, {"q": "Какие условия не являются причиной замены СИЗ?", "a": "Наличие на СИЗ устаревшего логотипа. Какие физические (юридические) лица могут являться субъектами обязательного страхования работника от несчастных случаев? – Страхователь, страховщик и выгодоприобретатель."}, {"q": "Каким документом оформляется приём на работу?", "a": "Актом работодателя, издаваемым на основании заклю- чённого трудового договора."}, {"q": "Каким документом оформляется проверка знаний по вопросам безопасности и охране труда у работников?", "a": "Протоколом заседания экзаменационной комиссии, создаваемой актом руководителя учебного центра в составе не менее трёх человек."}, {"q": "Каким документом устанавливается порядок работы экзаменационной комиссии по проверке знаний по во- просам безопасности и охраны труда работников?", "a": "Актом работодателя."}, {"q": "Какова максимальная продолжительность испытательного срока работника?", "a": "Не может превышать три месяца."}, {"q": "Какова периодичность пересмотра инструкции по профессиям или видам работ?", "a": "Не реже одного раза в 3 года."}, {"q": "Каковы Задачи прокуратуры?", "a": "Обеспечение верховенства права, законности и правопорядка, защита прав и законных интересов граждан и организаций, а также общественных и государственных интересов."}, {"q": "Каковы особенности противошумных наушников с активной защитой?", "a": "Активные противошумные науш- ники обрабатывают самые громкие сигналы и создают противофазу — разворачивают звук на 180 градусов, тем самым доводя уровень шума до комфортного человеческому слуху уровня."}, {"q": "Какого вида искусственного освещения нет?", "a": "Целевого."}, {"q": "Какой вид инструктажа по безопасности и охране труда проводят с работниками при приеме на работу неза- висимо от их образования, стажа работы по данной профессии или должности?", "a": "Вводный."}, {"q": "Какой документ регламентирует положения по безопасности и охране труда?", "a": "Трудовой Кодекс Республики Казахстан."}, {"q": "Кем проводится повторный инструктаж?", "a": "Ответственным работником (мастер, начальник отдела, цеха, непосредственный руководитель)."}, {"q": "Кем создаётся комиссия по расследованию групповых несчастных случаев, при гибели более пяти человек?", "a": "Правительством Республики Казахстан."}, {"q": "Кем создаётся экзаменационная комиссия по проверке знаний работников по вопросам безопасности и охраны труда?", "a": "Работодателем."}, {"q": "Кем устанавливается хроническое профессиональное заболевание?", "a": "Экспертной профпатологической комис- сией."}, {"q": "Кем утверждается перечень профессий и должностей работников, освобождаемых от прохождения первич- ного инструктажа на рабочем месте?", "a": "Работодателем."}, {"q": "Кем утверждается список работников организации, перечень работ и профессий, по которым проводится обучение, а также порядок и форму обучения, исходя из характера профессии, вида работ, специфики произ- водства и условий труда по согласованию с представителями работников (при их наличии)?", "a": "Работода- тель."}, {"q": "Кем утверждаются правила трудового распорядка?", "a": "Работодателем."}, {"q": "Когда не выдается молоко и лечебно-профилактическое питание (ЛПП)?", "a": "(в связи с особо вредными услови- ями труда) В нерабочие дни; во время отпуска, служебных командировок; в дни учебы с отрывом от производ- ства; во время выполнения работ на других участках, где выдача ЛПП не предусмотрена; в период временной не- трудоспособности."}, {"q": "Кто несёт ответственность за организацию расследования и регистрацию несчастных случаев, связанных с трудовой деятельностью, и профессиональных заболеваний на производстве?", "a": "Работодатель."}, {"q": "Кто утверждает порядок выдачи работникам молока или равноценных пищевых продуктов и (или) специа- лизированных продуктов для диетического (лечебного и профилактического) питания, специальной одежды и других средств индивидуальной защиты, а также устанавливает порядок обеспечения их средствами кол- лективной защиты, санитарно-бытовыми помещениями и устройствами за счёт средств работодателя?", "a": "Уполномоченный государственный орган по труду. Место постоянного или временного нахождения работника при выполнении им трудовых обязанностей в процессе трудовой деятельности? – Рабочее место."}, {"q": "На какой срок заключается коллективный договор?", "a": "На срок, определяемый сторонами."}, {"q": "На какой срок может быть заключён трудовой договор?", "a": "Все ответы верны. (на время выполнения определён- ной работы; на неопределённый срок; время выполнения сезонной работы)."}, {"q": "На какой срок работодатель в случае производственной необходимости имеет право временно перевести работника на другую работу без его согласия на срок?", "a": "До трёх месяцев в течение календарного года."}, {"q": "Нахождение вредных веществ в воздухе рабочей зоны ограничивается...?", "a": "Предельно допустимыми концен- трациями (ПДК)."}, {"q": "Начиная с какого уровня шума требуется обязательное использование СИЗ органов слуха?", "a": "Показатель уровня шума превышает 80 дБА."}, {"q": "Не подлежат учёту как несчастные случаи, связанные с трудовой деятельностью, повреждения здоровья ра- ботников, работников направляющей стороны, в ходе расследования которых объективно установлено, что они произошли?", "a": "Все ответы верны. (при выполнении пострадавшим по собственной инициативе работ или иных действий, не входящих в функциональные обязанности работника, работника направляющей стороны, и не связанных с интересом работодателя или принимающей стороны, в том числе в период междусменного отдыха при работе вахтовым методом, перерыва для отдыха и приёма пищи; в результате преднамеренного (умышлен- ного) причинения вреда своему здоровью, а также при совершении пострадавшим уголовного правонарушения, из- за внезапного ухудшения здоровья пострадавшего, не связанного с воздействием производственных факторов, подтвержденного медицинским заключением; в случае, когда основной причиной явилось состояние алкогольного опьянения, употребления пострадавшим токсических и наркотических веществ (их аналогов))."}, {"q": "Неполным рабочим временем считается…?", "a": "Все ответы верны. (неполная рабочая неделя, то есть сокраще- ние числа рабочих дней в рабочей неделе; неполный рабочий день, то есть уменьшение нормы продолжительно- сти ежедневной работы (рабочей смены); одновременное уменьшение нормы продолжительности ежедневной работы (рабочей смены) и сокращение числа рабочих дней в рабочей неделе)."}, {"q": "Нормальная продолжительность рабочего времени не должна превышать…?", "a": "40 часов в неделю."}, {"q": "Ночным рабочим временем считается?", "a": "С 22 до 6 часов."}, {"q": "Общая продолжительность сверхурочных работ в год не должна превышать?", "a": "Сто двадцать часов в год."}, {"q": "Общая продолжительность сверхурочных работ в месяц не должна превышать?", "a": "12 часов."}, {"q": "Обязанность рабочих и служащих возместить имущественный ущерб, причинённый по их вине предприя- тию (учреждению), в котором они работают, а также обязанность учреждения (предприятия) возместить ущерб, причинённый здоровью трудящихся, – это?", "a": "Материальная ответственность."}, {"q": "Одна из основных форм простого процесса труда, которая характеризуется существенным преобладанием физической нагрузки человека над психической, – это?", "a": "Физический труд."}, {"q": "Отношения между работником и работодателем, возникающие при осуществлении прав и обязанностей, предусмотренных трудовым кодексом Республики Казахстан, – это…?", "a": "Трудовые отношения."}, {"q": "Письменное соглашение между работником и работодателем, в соответствии с которым работник обязуется выполнять определённую работу, соблюдая трудовой распорядок, а работодатель обязуется предоставить работнику работу по обусловленной трудовой функции, обеспечив безопасные условия труда, – это…?", "a": "Тру- довой договор."}, {"q": "Полное или частичное прекращение работы в целях удовлетворения социально-экономических и професси- ональных требований работников в коллективном трудовом споре с работодателем – это?", "a": "Забастовка."}, {"q": "Правовой акт в форме письменного соглашения, заключаемого между работниками в лице их представите- лей и работодателем, регулирующий социально- трудовые отношения в организации это…?", "a": "Коллективный договор."}, {"q": "Предрейсовый и послерейсовый медицинский осмотр проводится?", "a": "В течение 30 минут перед началом рейса, и в течение 30 минут после окончания рейса."}, {"q": "При временном переводе в структурное подразделение работодателя, расположенное в другой местности, работнику оплачиваются…?", "a": "Компенсация в размере, предусмотренном статьёй 127 Кодекса. При каких условиях применяются средства индивидуальной защиты органов дыхания и маски с химиче- ским картриджем/ противогазом? – Работа в загазованной среде, фильтрация и очистка воздуха от химических газов и паров."}, {"q": "При каком количестве работников работодатель создает службу безопасности и охраны труда?", "a": "С численно- стью работников более пятидесяти работников."}, {"q": "При наличии каких опасных факторов используются защитные очки закрытого типа с прямой вентиля- цией?", "a": "Разлетающиеся частицы и стружки."}, {"q": "При прекращении трудового договора работнику, который не использовал или использовал не полностью оплачиваемый ежегодный трудовой отпуск (ежегодные трудовые отпуска), производится?", "a": "Компенсацион- ная выплата за неиспользованные им дни оплачиваемого ежегодного трудового отпуска (ежегодных трудовых отпусков)."}, {"q": "При расследовании несчастных случаев, связанных с трудовой деятельностью работодатель обязан…?", "a": "1) организовать оказание первой медицинской помощи пострадавшему и при необходимости его доставку в органи- зацию здравоохранения; 2) сохранить до начала расследования обстановку на месте несчастного случая, связанного с трудовой деятель- ностью, (состояние оборудования и механизмов, орудия труда) в таком же виде, как в момент происшествия, при условии, что это не угрожает жизни и здоровью других лиц, а нарушение непрерывности производственного процесса не приведет к аварии, а также произвести фотографирование места несчастного случая; 3) немедленно проинформировать о несчастном случае близких родственников пострадавшего и направить сооб- щение в государственные органы и организации, определенные настоящим Кодексом, иными нормативными пра- вовыми актами; 4) допускать членов комиссии по специальному расследованию к месту происшествия для расследования несчаст- ного случая, связанного с трудовой деятельностью."}, {"q": "При сменной работе продолжительность рабочей смены, переход из одной рабочей смены в другую устанав- ливаются…?", "a": "Графиками сменности."}, {"q": "Привлечение работника к работе в течение двух рабочих смен подряд…?", "a": "Запрещается."}, {"q": "Приём на работу оформляется…?", "a": "Актом работодателя, издаваемым на основании заключенного трудового договора."}, {"q": "Проверка знаний по вопросам безопасности и охране труда у работников оформляется…?", "a": "Протоколом и удостоверением."}, {"q": "Продолжительность ежедневного (междусменного) отдыха работника между окончанием работы и ее нача- лом на следующий день (рабочую смену) не может быть менее?", "a": "Не может быть менее двенадцати часов."}, {"q": "С какой периодичностью проводится обучение и проверка знаний у работников по безопасности и охране труда?", "a": "Не реже одного раза в год."}, {"q": "С какой периодичностью работодатель с привлечением специализированных организаций обязан прово- дить аттестацию производственных объектов по состоянию условий труда?", "a": "Не реже, чем один раз в пять лет."}, {"q": "Сокращённая продолжительность рабочего времени для работников от 14 до 16 лет не должна превы- шать…?", "a": "24 часа в неделю."}, {"q": "Сокращённая продолжительность рабочего времени для работников от 16 до 18 лет не должна превы- шать…?", "a": "36 часов в неделю."}, {"q": "Сокращённая продолжительность рабочего времени для работников, занятых на тяжёлых работах, работах с вредными и (или) опасными условиями труда не должна превышать…?", "a": "36 часов в неделю."}, {"q": "Состояние защищённости работников, обеспеченное комплексом мероприятий, исключающих воздействие вредных и (или) опасных производственных факторов на работников в процессе трудовой деятельности, – это?", "a": "Безопасность труда."}, {"q": "Срок действия дисциплинарного взыскания не может превышать?", "a": "Шесть месяцев со дня его применения."}, {"q": "Страховщик – это…?", "a": "Юридическое лицо, получившее лицензию на право осуществления страховой деятельно- сти в отрасли «страхование жизни» по классу аннуитетное страхование и данному виду страхования на терри- тории Республики Казахстан."}, {"q": "Субъектами (сторонами) трудовых отношений являются…?", "a": "Работник и работодатель. Труд наёмного работника (владеющего только своей рабочей силой) в интересах нанимателя (работода- теля), владеющего на правах собственности или аренды средствами производства и выступающего органи- затором производства, – это? – Наёмный труд."}, {"q": "Труд собственника средств производства либо их арендатора на самого себя (и на свой страх и риск) – это?", "a": "Частный труд."}, {"q": "Условия труда, которые характеризуются наличием вредных производственных факторов, – это…?", "a": "Вред- ные условия труда."}, {"q": "Условия труда, при которых сохраняется здоровье работающих и создаются предпосылки для поддержания высокого уровня работоспособности это…?", "a": "1 класс - ОПТИМАЛЬНЫЕ условия труда."}, {"q": "Физическое или юридическое лицо, с которым работник состоит в трудовых отношениях, – это…?", "a": "Работо- датель."}, {"q": "Физическое лицо, состоящее в трудовых отношениях с работодателем и непосредственно выполняющее ра- боту по трудовому договору – это…?", "a": "Работник."}, {"q": "Хроническое или острое заболевание человека, являющееся результатом воздействия на него вредного (вредных) производственного (производственных) фактора (факторов) и повлекшее временную или стой- кую утрату им профессиональной трудоспособности, – это?", "a": "Профессиональное заболевание."}, {"q": "Чем ограничивается нахождение вредных веществ в воздухе рабочей зоны?", "a": "Предельно допустимыми кон- центрациями (ПДК)."}, {"q": "Что не входит в минимальный комплект СИЗ, необходимый любому работнику или руководителю для до- ступа на производственные участки компании?", "a": "Спецодежды, закрывающей тело; Маски, респиратора или противогаза; Обуви, перчаток или рукавиц; Шапки, каски или щитка."}, {"q": "Что является основанием расторжения трудового договора по инициативе работодателя?", "a": "Несоответствия работника требованиям к профессиональной деятельности, установленным законами Республики Казахстан."}, {"q": "Что является принципами трудового законодательства Республики Казахстан?", "a": "Все ответы верны. (приори- тет жизни и здоровья работника; свобода труда; равенство прав и возможностей работников). Запрещается не предоставление неиспользованного оплачиваемого ежегодного трудового отпуска либо его части в течение? – Двух лет подряд."}, {"q": "Какая продолжительность основного оплачиваемого ежегодного трудового отпуска?", "a": "Двадцать четыре ка- лендарных дня."}, {"q": "Какова продолжительность обучения по развитию общих профессиональных компетенций по вопросам без- опасности и охраны труда для ответственных работников субъектов крупного предпринимательства состав- ляет?", "a": "Не менее 72 академических часов."}, {"q": "Какое воздействие оказывает на организм электрический ток?", "a": "Термическое, электролитическое и биологиче- ское воздействия."}, {"q": "Какой акт работодателя называется инструкцией по безопасности и охране труда?", "a": "Детализирующий применение законодательства в области охраны труда при выполнении работ в производственных помещениях, на территории предприятия, строительных площадках, транспортных средствах и в иных местах организации, где производятся эти работы или выполняются служебные обязанности."}, {"q": "Какой прибор применяют для определения относительной влажности воздуха в помещении?", "a": "Гигрометр."}, {"q": "Комплекс мер, принимаемый в любой организации в целях недопущения возгораний, угрозы жизни и здоро- вью людей, а также повреждения имущества, – это?", "a": "Пожарная безопасность."}, {"q": "При оборудовании цехов и участков с повышенными тепловыделениями естественной вентиляцией (аэра- цией) на кровлях предусматриваются?", "a": "Не задуваемые шахты или аэрационные фонари, оборудованные меха- низированными фрамугами с дистанционным управлением."}, {"q": "С кем может быть заключен Трудовой договор?", "a": "1) гражданами, достигшими пятнадцати лет, в случаях по- лучения ими основного среднего, общего среднего образования в организации среднего образования; 2) учащимися, достигшими четырнадцатилетнего возраста, для выполнения в свободное от учебы время работы, не причиняющей вреда здоровью и не нарушающей процесса обучения; 3) с лицами, не достигшими четырнадцатилетнего возраста, в организациях кинематографии, театрах, теат- ральных и концертных организациях, цирках для участия в создании и (или) исполнении произведений без ущерба здоровью и нравственному развитию с соблюдением условий, определенных подпунктом 2) настоящего пункта."}, {"q": "Что является основанием прекращения трудового договора?", "a": "1) расторжение трудового договора по соглашению сторон; 2) истечение срока трудового договора; 3) расторжение трудового договора по инициативе работодателя; 4) в связи с переводом работника к другому работодателю; 5) расторжение трудового договора по инициативе работника; 6) обстоятельства, не зависящие от воли сторон; 7) отказ работника от продолжения трудовых отношений; 8) переход работника на выборную работу (должность) или назначение его на должность, исключающую воз- можность продолжения трудовых отношений, кроме случаев, предусмотренных законами Республики Казах- стан; 9) нарушение условий заключения трудового договора."}];unction shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const select=document.getElementById('block');for(let start=0;start<DATA.length;start+=30){let end=Math.min(start+30,DATA.length);let opt=document.createElement('option');opt.value=start;opt.textContent=`${start+1}–${end} (${end-start} вопросов)`;select.append(opt)}
let start=0, questions=[],idx=0,answers={},reviewMode=false;
function loadBlock(){start=+select.value;questions=DATA.slice(start,Math.min(start+30,DATA.length)).map((d,i)=>({src:d,idx:start+i,choices:[]}));idx=0;answers={};reviewMode=false;document.getElementById('quiz').classList.remove('hide');document.getElementById('result').classList.add('hide');makeChoices();render()}
function makeChoices(){questions.forEach((item)=>{let wrong=shuffle(DATA.filter(x=>x.a!==item.src.a)).slice(0,3).map(x=>x.a);item.choices=shuffle([item.src.a,...wrong])})}
function render(){let item=questions[idx];document.getElementById('counter').textContent=`Вопрос ${idx+1} / ${questions.length}`;let percent=Math.round((idx/Math.max(1,questions.length))*100);document.getElementById('pct').textContent=percent+'%';document.getElementById('fill').style.width=percent+'%';document.getElementById('q').textContent=item.src.q;let ans=document.getElementById('answers');ans.innerHTML='';item.choices.forEach((choice,n)=>{let b=document.createElement('button');b.className='option'+(answers[idx]===choice?' selected':'');b.innerHTML=`<span class="letter">${String.fromCharCode(65+n)}</span><span></span>`;b.querySelector('span:last-child').textContent=choice;b.onclick=()=>{answers[idx]=choice;render()};ans.append(b)});document.getElementById('prev').disabled=idx===0;document.getElementById('next').textContent=idx===questions.length-1?'Завершить':'Далее →'}
document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render()}};document.getElementById('next').onclick=()=>{if(!answers.hasOwnProperty(idx)){alert('Выбери ответ, чтобы продолжить.');return}if(idx<questions.length-1){idx++;render()}else showResult()};
function showResult(){let correct=questions.filter((q,i)=>answers[i]===q.src.a).length;document.getElementById('quiz').classList.add('hide');let result=document.getElementById('result');result.classList.remove('hide');let pct=Math.round(correct/questions.length*100);result.innerHTML=`<h2>Тест завершён!</h2><div class="score">${correct} / ${questions.length}</div><p>Правильных ответов · ${pct}%</p><p class="muted">${pct>=90?'Отличный результат!':pct>=70?'Хороший результат, можно ещё закрепить.':'Повтори материал и попробуй ещё раз.'}</p><div class="controls"><button class="btn secondary" id="retry">Пройти заново</button><button class="btn primary" id="showreview">Показать ошибки</button></div><div class="review" id="review"></div>`;document.getElementById('retry').onclick=loadBlock;document.getElementById('showreview').onclick=()=>{let r=document.getElementById('review');r.innerHTML=questions.map((q,i)=>answers[i]===q.src.a?'':`<div class="reviewitem"><b>${q.src.q}</b><br><span class="muted">Ваш ответ:</span> ${answers[i]||'—'}<br><span style="color:#1d6252;font-weight:700">Правильный ответ:</span> ${q.src.a}</div>`).join('')||'Ошибок нет — отлично!'} }
select.onchange=loadBlock;loadBlock();
</script></body></html>
